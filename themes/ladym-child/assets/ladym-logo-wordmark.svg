<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 210 80" role="img" aria-label="Lady M Hungary" style="overflow:visible">
  <!-- Monogram: bordó négyzet + Playfair "M" (a faviconnal koherens mark) -->
  <rect x="0" y="11" width="60" height="60" fill="#65273c"/>
  <text x="30" y="56" text-anchor="middle"
        font-family="'Playfair Display', Georgia, 'Times New Roman', serif"
        font-weight="600" font-size="40" fill="#f4f2f6">M</text>

  <!-- Wordmark: LADY M (az M bordó akcent) -->
  <text x="78" y="40"
        font-family="'Playfair Display', Georgia, 'Times New Roman', serif"
        font-weight="600" font-size="27" letter-spacing="4" fill="#0a0a0f">LADY <tspan fill="#65273c">M</tspan></text>

  <!-- Editorial elválasztó vonal -->
  <line x1="80" y1="50.5" x2="204" y2="50.5" stroke="#d9d5dd" stroke-width="1.4"/>

  <!-- Eyebrow: HUNGARY, tág betűközzel -->
  <text x="81" y="66"
        font-family="Inter, system-ui, -apple-system, sans-serif"
        font-weight="600" font-size="10.5" letter-spacing="6.5" fill="#41415b">HUNGARY</text>
</svg>
